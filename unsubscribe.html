<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Email preferences · ZentryCRM</title><link rel="stylesheet" href="/brand.css"></head><body class="preference-page"><main class="preference-card"><a class="wordmark" href="/" aria-label="Zentry home">ZENTRY<span>CRM</span></a><div class="eyebrow">YOUR INBOX. YOUR CHOICE.</div><h1 id="title">Less email.<br>More control.</h1><p id="message">Stop future outreach from this sender in the spreadsheet that sent this email. Confirm below to save your preference.</p><button class="button" id="unsubscribe">Unsubscribe from these emails</button><p id="status" role="status" aria-live="polite"></p><p class="small">Need help? <a href="mailto:cs@zentrycrm.com">cs@zentrycrm.com</a></p></main><script>
(function(){const button=document.getElementById('unsubscribe'),status=document.getElementById('status');const token=new URLSearchParams(location.search).get('token');history.replaceState(null,'',location.pathname);if(!token||token.length>2048||!/^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]{43}$/.test(token)){button.hidden=true;document.getElementById('title').textContent='A link is needed.';document.getElementById('message').textContent='Open the Unsubscribe link in your email to manage your preference.';return;}button.onclick=async function(){button.disabled=true;status.textContent='Saving your preference…';try{const response=await fetch('/api/unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});const result=await response.json();if(!response.ok||result.success!==true)throw Error();document.getElementById('title').textContent='You’re unsubscribed.';document.getElementById('message').textContent='You won’t receive further outreach from this sender in this spreadsheet. No sign-in or further action is needed.';button.hidden=true;status.textContent='Your preference has been saved.';}catch(e){status.textContent='We couldn’t confirm your request. Please retry, or contact the sender directly.';button.disabled=false;}};})();
</script></body></html>
